<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1220">
<title>LubeCalc Pro · Shovel Edition</title>
<style>/* ── LubeCalc Pro v4 · sistema de diseño ───────────────────────────── */
:root{
  --bg:#0A1220; --bg-2:#0D1727; --surface:#121D31; --surface-2:#172540; --surface-3:#1D2E4D;
  --line:#243451; --line-2:#2F4367;
  --text:#E9EFF8; --text-2:#B4C2D6; --muted:#8597B2; --muted-2:#7287A4;
  --amber:#F5B324; --amber-2:#FFD066; --amber-ink:#1A1200;
  --steel:#7F97BC; --steel-2:#A9BCDA;
  --ok:#4ECB8D; --ok-ink:#07301C; --warn:#FF8A5B; --bad:#FF6B6B; --info:#4FA3FF;
  --A1:#F5B324; --A2:#4FA3FF; --B1:#FFD066; --B2:#5CD68A; --C1:#FF8A5B; --C2:#FF6B6B;
  --r:14px; --r-sm:10px; --r-xs:7px;
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --display:"Bahnschrift","Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.4);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
::selection{background:rgba(245,179,36,.35);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
*::-webkit-scrollbar{height:8px;width:8px}*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
.disp{font-family:var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
@media(min-width:720px){.wrap{padding:0 22px}}
main{display:grid;gap:18px}
main.wrap{padding-top:18px;padding-bottom:96px}
section[id]{scroll-margin-top:118px}
section>h2,.h2{font-family:var(--font);font-weight:600;font-size:17px;margin:0 0 4px;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:72ch}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(10,18,32,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-2);font-size:13px;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1E5EFF,#4FA3FF);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(79,163,255,.7)}
.brand .mark span{font-family:var(--display);font-weight:800;font-size:17px;color:#fff}
.brand h1{font-family:var(--display);font-weight:700;font-size:21px;margin:0;line-height:1}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-weight:500;font-size:14px;transition:background .18s var(--ease),transform .12s var(--ease),border-color .18s}
.btn:hover{background:var(--surface-3);color:var(--text)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:600}
.btn.primary:hover{background:var(--amber-2);border-color:var(--amber-2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.icon{width:42px;padding:0}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel.pad{padding:18px}
@media(min-width:720px){.panel.pad{padding:22px}}

/* hero */
.hero{display:grid;overflow:hidden}
@media(min-width:1000px){.hero{grid-template-columns:3fr 2fr}}
.hero .stage{padding:14px 14px 10px}
@media(min-width:720px){.hero .stage{padding:20px 20px 14px}}
.stage-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.stage-top p{margin:0;font-size:13px;color:var(--muted)}
.stage svg{width:100%;height:auto;display:block}
.syslegend{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.syslegend button{border-radius:9px;padding:8px 4px;text-align:center;border:1px solid var(--line);background:var(--bg-2);transition:background .18s,border-color .18s,transform .12s}
.syslegend button b{display:block;font-family:var(--display);font-size:18px;line-height:1;color:var(--c)}
.syslegend button small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syslegend button[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.syslegend button[aria-pressed="true"] b,.syslegend button[aria-pressed="true"] small{color:#0A1220}
.hero .side{background:var(--bg-2);border-top:1px solid var(--line);padding:16px;display:grid;gap:14px;align-content:start}
@media(min-width:1000px){.hero .side{border-top:0;border-left:1px solid var(--line);padding:20px}}

/* KPI headline */
.kpi{display:grid;gap:4px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .big b{font-family:var(--display);font-weight:700;font-size:56px;line-height:.95;color:var(--amber);font-variant-numeric:tabular-nums}
.kpi .big span{font-size:15px;color:var(--text-2)}
.kpi .vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:13.5px;color:var(--text-2)}
.kpi .vs .fl1{font-family:var(--display);font-size:22px;color:var(--steel-2);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap}
.tag.ok{background:rgba(78,203,141,.16);color:var(--ok)}
.tag.bad{background:rgba(255,107,107,.16);color:var(--bad)}
.tag.neutral{background:var(--surface-2);color:var(--text-2);font-weight:500}
.tag.slv{background:rgba(245,179,36,.16);color:var(--amber)}
.tag.fl1{background:rgba(127,151,188,.18);color:var(--steel-2)}

/* selected system detail */
.detail{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.detail .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.detail .head b{font-family:var(--display);font-size:34px;line-height:1;color:var(--c)}
.detail .head span{font-size:13.5px;color:var(--text-2);text-align:right}
.detail .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.detail .row b{font-family:var(--display);font-size:40px;line-height:1}
.detail .row span{color:var(--muted);font-size:13px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xs);padding:8px 10px}
.mini b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.mini span{font-size:11px;color:var(--muted)}
.note{font-size:12.5px;color:var(--text-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xs);padding:8px 10px}

/* slider */
.slider{display:grid;gap:8px}
.slider .stop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slider .stop b{font-family:var(--display);font-size:38px;line-height:1}
.slider .stop b small{font-size:20px;color:var(--muted);font-weight:600}
.slider .stop span{font-size:13px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--A2) var(--v),var(--line) var(--v));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:6px solid var(--A2);box-shadow:0 4px 14px -4px rgba(79,163,255,.8);cursor:pointer}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:6px solid var(--A2);cursor:pointer}
.slider .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-2)}

/* scorecards */
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
.sc{display:grid;gap:12px;padding:16px;cursor:pointer;transition:border-color .18s,transform .15s var(--ease)}
.sc:hover{border-color:var(--line-2)}
.sc[aria-selected="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),var(--shadow)}
.sc .id{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sc .id .code{font-family:var(--display);font-size:30px;line-height:1;color:var(--c);font-weight:700}
.sc .id .name{font-size:14px;font-weight:600;color:var(--text)}
.sc .id .lube{font-size:11.5px;color:var(--muted);margin-top:2px}
.sc .score{text-align:right}
.sc .score b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-weight:700}
.sc .score b.ok{color:var(--ok)}.sc .score b.bad{color:var(--bad)}
.sc .score span{font-size:11px;color:var(--muted)}
.dual{display:grid;gap:5px}
.dual .bar{display:grid;grid-template-columns:38px 1fr 92px;align-items:center;gap:8px;font-size:12px}
.dual .bar .k{color:var(--muted)}
.dual .bar .track{height:14px;border-radius:5px;background:var(--bg-2);overflow:hidden}
.dual .bar .fill{height:100%;border-radius:5px;transition:width .35s var(--ease)}
.dual .bar.slv .fill{background:var(--amber)}
.dual .bar.fl1 .fill{background:var(--steel)}
.dual .bar .v{text-align:right;font-weight:600}
.stepper{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.stepper .lbl{font-size:12.5px;color:var(--muted)}
.stepper .lbl b{display:block;color:var(--text);font-weight:500;font-size:13px}
.stepper .ctl{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--bg-2)}
.stepper .ctl button{width:38px;height:38px;font-size:18px;color:var(--text-2);transition:background .15s}
.stepper .ctl button:hover{background:var(--surface-3);color:var(--text)}
.stepper .ctl input{width:56px;height:38px;text-align:center;background:transparent;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--display);font-size:19px;font-weight:600;-moz-appearance:textfield}
.stepper .ctl input::-webkit-inner-spin-button{display:none}
.stepper .ctl input:focus-visible{outline-offset:-2px;border-radius:0}
.stepper .changed{font-size:11px;color:var(--amber);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;background:var(--bg-2);border:1px solid var(--line);font-size:12px;color:var(--text-2)}
.chip b{color:var(--text);font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.facts div{font-size:11.5px;color:var(--muted)}
.facts div b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;color:var(--text);font-weight:600}

/* monthly comparison */
.mgrid{display:grid;gap:16px}
@media(min-width:1000px){.mgrid{grid-template-columns:2fr 1fr}}
.chart{overflow-x:auto;padding-bottom:6px}
.chart .inner{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(44px,1fr);gap:6px;min-width:620px;align-items:end;padding:0 2px}
.col{display:grid;grid-template-rows:176px auto;gap:6px;cursor:pointer;border-radius:8px;padding:4px 2px 2px;transition:background .18s}
.col:hover{background:var(--surface-2)}
.col[aria-pressed="true"]{background:var(--surface-3)}
.col .bars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:176px}
.col .b{width:40%;border-radius:4px 4px 2px 2px;transition:height .4s var(--ease);min-height:2px;position:relative}
.col .b.slv{background:var(--amber)}.col .b.fl1{background:var(--steel)}
.col .b.zero{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.col .m{text-align:center;font-size:11px;color:var(--muted);line-height:1.15;white-space:nowrap}
.col .m small{display:block;color:var(--muted-2);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.totals{display:grid;gap:12px}
.tot{display:grid;gap:2px}
.tot .k{font-size:12.5px;color:var(--muted)}
.tot .v{font-family:var(--display);font-size:34px;line-height:1;font-weight:700}
.tot .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.drums{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.drums i{width:11px;height:18px;border-radius:2px;background:var(--line)}
.drums i.on{background:var(--ok)}
details.hours{border-top:1px solid var(--line);padding-top:12px}
details.hours summary{cursor:pointer;font-size:13.5px;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px}
details.hours summary::-webkit-details-marker{display:none}
details.hours summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-left:auto}
details.hours[open] summary::after{transform:rotate(-135deg)}
.hrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:12px}
.hrs label{font-size:11.5px;color:var(--muted);display:grid;gap:3px}
.field{width:100%;min-height:42px;padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);font-size:16px;transition:border-color .15s}
.field:hover{border-color:var(--muted-2)}
.field:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
input.field[type=number]{-moz-appearance:textfield}input.field::-webkit-inner-spin-button{opacity:.35}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}

/* live */
.live{display:grid;gap:14px}
@media(min-width:720px){.live{grid-template-columns:1fr 1fr}}
.race{display:grid;gap:8px}
.race .lane{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}
.race .lane .k{font-size:12.5px;font-weight:600}
.race .lane .track{height:34px;border-radius:9px;background:var(--bg-2);overflow:hidden;position:relative}
.race .lane .fill{height:100%;border-radius:9px;transition:width .12s linear}
.race .lane.slv .fill{background:var(--amber)}.race .lane.fl1 .fill{background:var(--steel)}
.race .lane .val{position:absolute;right:10px;top:0;height:100%;display:flex;align-items:center;font-family:var(--display);font-size:20px;font-weight:700}
.live-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--bg-2)}
.seg button{padding:8px 12px;font-size:13px;color:var(--text-2);transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);font-weight:600}
.prog{height:8px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--A2),var(--amber));width:0;transition:width .12s linear}
.live .big{display:flex;align-items:baseline;gap:8px}
.live .big b{font-family:var(--display);font-size:46px;line-height:1;color:var(--ok)}
.live .big span{color:var(--muted);font-size:13.5px}

/* lab */
.lab{display:grid;gap:16px}
@media(min-width:900px){.lab{grid-template-columns:1fr 1fr}}
.lab .vis{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);display:grid;place-items:center;padding:12px}
.lab .vis svg{width:100%;max-width:300px;height:auto}
.lab .form{display:grid;gap:12px}
.lab label.block{display:grid;gap:5px;font-size:13px;color:var(--text-2)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts button{padding:10px 4px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);font-family:var(--display);font-size:17px;font-weight:600;color:var(--text-2);transition:background .15s,border-color .15s}
.opts button[aria-pressed="true"]{background:var(--surface-3);border-color:var(--info);color:var(--text)}
.adjs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.adjs button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);text-align:left;font-size:13px;color:var(--text-2);transition:background .15s,border-color .15s}
.adjs button i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--dot)}
.adjs button span{flex:1}
.adjs button b{font-weight:600;color:var(--text)}
.adjs button[aria-pressed="true"]{background:var(--surface-3);border-color:var(--dot);color:var(--text)}
.delta{display:grid;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-xs);padding:10px 12px;font-size:13px}
.delta div{display:flex;justify-content:space-between;gap:10px}
.delta .k{color:var(--muted)}

/* inventory */
.inv{display:grid;gap:10px}
.grp{overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:14px 16px;text-align:left;transition:background .15s}
.grp>summary:hover{background:var(--surface-2)}
.grp .code{font-family:var(--display);font-size:26px;color:var(--c);font-weight:700;width:34px}
.grp .nm{font-weight:600;font-size:14px}
.grp .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.grp .sum{text-align:right;font-size:12.5px;color:var(--muted)}
.grp .sum b{display:block;color:var(--text);font-size:14px}
.grp .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.grp[open] .chev{transform:rotate(-135deg)}
.grp table{width:100%;border-collapse:collapse;font-size:13px}
.grp thead th{font-weight:500;color:var(--muted);text-align:left;padding:0 8px 6px;font-size:11.5px;border-bottom:1px solid var(--line)}
.grp tbody td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.grp tbody tr:last-child td{border-bottom:0}
.grp .tbl{padding:4px 12px 12px;overflow-x:auto}
.grp .tbl .field{min-height:36px;padding:6px 8px;font-size:13.5px}
.grp td.c{text-align:center}.grp td.r{text-align:right}
.grp .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px;background:var(--dot)}
.grp .x{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:16px;transition:background .15s,color .15s}
.grp .x:hover{background:rgba(255,107,107,.15);color:var(--bad)}
.grp .add{margin:8px 12px 12px;width:calc(100% - 24px);min-height:40px;border:1px dashed var(--line-2);border-radius:9px;color:var(--text-2);font-size:13px;transition:background .15s}
.grp .add:hover{background:var(--surface-2)}
.grp .fl1v{color:var(--steel-2)}
.grp .nameIn{min-width:170px}

/* params */
.pgrid{display:grid;gap:14px}
@media(min-width:900px){.pgrid{grid-template-columns:1fr 1fr 1fr}}
.fieldset{display:grid;gap:10px}
.fieldset label{display:grid;gap:4px;font-size:13px;color:var(--text-2)}
.fieldset label small{color:var(--muted);font-size:11.5px}
.lubesys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lubesys label{font-size:12px;color:var(--muted)}
.lubesys label b{color:var(--c);font-family:var(--display);font-size:16px}

/* footer note */
.foot{font-size:12.5px;color:var(--muted);padding:14px 16px;display:grid;gap:4px}
.foot b{color:var(--text-2);font-weight:600}

/* shovel overlay anims */
@keyframes ring{0%{r:14;opacity:.9}70%{r:44;opacity:0}100%{r:44;opacity:0}}
@keyframes track{to{stroke-dashoffset:-60}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes piston{0%{transform:translateY(0)}40%{transform:translateY(46px)}100%{transform:translateY(0)}}
@keyframes drop{0%{opacity:0;transform:translateY(-6px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(34px) scale(1.1)}}
.ring{animation:ring var(--dur,2s) ease-out infinite;transform-box:fill-box;transform-origin:center}
.tracks{stroke-dasharray:22 14;animation:track var(--tdur,2s) linear infinite}
.flowline{stroke-dasharray:10 10;animation:flow .8s linear infinite}
.piston{animation:piston 1.1s var(--ease) 1;transform-box:fill-box}
.droplet{animation:drop 1.1s ease-in 1;transform-box:fill-box}
.hot{cursor:pointer}
.hot text{font-family:var(--display);font-weight:800}
@media(prefers-reduced-motion:reduce){.ring,.tracks,.flowline,.piston,.droplet{animation:none}*{transition:none!important}}

[hidden]{display:none!important}
.grp summary::-webkit-details-marker{display:none}
.grp .rows{display:grid;gap:8px;padding:2px 12px 4px}
.grp .empty{padding:10px 16px 14px;color:var(--muted);font-size:13px}
.irow{display:grid;gap:8px;padding:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-areas:"name name name name" "qty qty sys sys" "now now nowcc nowcc" "old old oldcc oldcc" "sum sum sum del"}
.irow label,.irow .f-sum{display:grid;gap:3px;min-width:0}
.irow label>span,.irow .f-sum>span{font-size:11px;color:var(--muted)}
.irow .field{min-height:40px;padding:6px 9px;font-size:16px}
.f-name{grid-area:name}.f-qty{grid-area:qty}.f-sys{grid-area:sys}.f-now{grid-area:now}.f-nowcc{grid-area:nowcc}
.f-old{grid-area:old}.f-oldcc{grid-area:oldcc}.f-sum{grid-area:sum;align-content:end}.irow .x{grid-area:del;justify-self:end;align-self:end}
.f-sum b{font-family:var(--display);font-size:17px;font-weight:600}
.f-old>span,.f-oldcc>span{color:var(--steel)}.f-now>span,.f-nowcc>span{color:var(--amber)}
@media(min-width:960px){
  .irow{grid-template-columns:minmax(150px,1.5fr) 64px 72px minmax(150px,1.3fr) 76px minmax(150px,1.3fr) 76px 130px 38px;align-items:end;
    grid-template-areas:"name qty sys now nowcc old oldcc sum del"}
}
.x{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}

.add{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 12px 12px;width:calc(100% - 24px);min-height:42px;border:1px dashed var(--line-2);border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;transition:background .15s}

.ic{display:inline-block;vertical-align:-3px;flex:none}
.split{display:grid;gap:8px;font-size:12.5px}
.split .sr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline}
.split .sr.h{color:var(--muted);font-size:11.5px}

.cmp-note{display:grid;gap:6px}

  A1: { name: 'Bujes de pluma', short: 'Bujes', pos: [950, 700], hue: '#F5B324', desc: 'Talón de pluma, shipper shaft y catalinas de silla' },
  A2: { name: 'Rodado · propulsión', short: 'Rodado', pos: [700, 860], hue: '#4FA3FF', desc: 'Rodados, ruedas tensoras y bujes de pin central. Dosifica distinto al excavar y al trasladar' },
  B1: { name: 'Engranajes de levante', short: 'Levante', pos: [640, 650], hue: '#FFD066', desc: 'Transmisión hoist' },
  B2: { name: 'Giro y empuje', short: 'Giro', pos: [760, 790], hue: '#5CD68A', desc: 'Corona de giro, pistas roller, TX crowd, golilla de pin y saddle block' },
  C1: { name: 'Antifricción · estructura', short: 'Estruct.', pos: [1110, 555], hue: '#FF8A5B', desc: 'Rodamientos de empuje, giro, dipper trip, hoist, pluma, A-frame y guía de cable' },
  C2: { name: 'Antifricción · motrices', short: 'Motrices', pos: [900, 860], hue: '#FF6B6B', desc: 'Rodamientos de ruedas motrices, ambos lados' },
};

const LUBES = {
  ultra: { name: 'Molylube Ultra Open Gear', short: 'Ultra', dens: 0.98 },
  term: { name: 'Termalene Multipurpose Extreme Pressure Grease', short: 'Termalene', dens: 0.858 },
};

/* Dosificación por tipo de inyector y ajuste: [etiqueta, cc por disparo, color] */
const GREY = '#94A3B8';
const INJ = {
  'SL-V': [['Camisa roja', 0.5, '#E0453B'], ['Camisa púrpura', 1.25, '#A66BE0'], ['Camisa verde', 1.25, '#3FBF6F'], ['Sin ajuste · 100 %', 1.31, GREY]],
  'FL-1': [['2 hilos · 25 %', 0.41, '#E0453B'], ['4 hilos · 50 %', 0.82, '#A66BE0'], ['6 hilos · 75 %', 1.23, '#3FBF6F'], ['Sin ajuste · 100 %', 1.61, GREY]],
  'FL-11': [['3 hilos · 25 %', 2.05, '#E0453B'], ['6 hilos · 50 %', 4.1, '#A66BE0'], ['9 hilos · 75 %', 6.15, '#3FBF6F'], ['Sin ajuste · 100 %', 8.2, GREY]],
  'FL-32': [['Estándar', 0.131, GREY]],
};
const CUSTOM = 'Personalizado';

/* Timers de referencia (min) según la matriz actual */
const T_REF = { A1: 30, A2dig: 30, A2prop: 3, B1: 15, B2: 10, C1: 20, C2: 2 };

const n = (v) => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
const optOf = (type, adj) => { const f = INJ[type].find((a) => a[0] === adj); return { type, adj, cc: f[1] }; };
const colorOf = (sel) => { const f = (INJ[sel.type] || []).find((a) => a[0] === sel.adj); return f ? f[2] : GREY; };

function mkInj() {
  let id = 0;
  const V = 'Camisa verde', ROJ = 'Camisa roja', S = 'Sin ajuste · 100 %';
  const now = (t, a) => optOf(t, a);
  /* R(sistema, componente, cantidad, actual, anterior?)  — si no hay "anterior", el SL-V pasa a FL-1 al 100 % */
  const R = (system, name, qty, cur, old) => ({
    id: ++id, system, name, qty,
    now: cur,
    old: old || (cur.type === 'SL-V' ? optOf('FL-1', S) : { ...cur }),
  });
  return [
    R('A1', 'Talón pluma LI / LD', 2, now('SL-V', V)),
    R('A1', 'Shipper Shaft derecho', 1, now('SL-V', S)),
    R('A1', 'Shipper Shaft izquierdo', 1, now('SL-V', S)),
    R('A1', 'Catalinas silla', 8, now('SL-V', V)),

    R('A2', 'Rodado derecho', 18, now('SL-V', ROJ)),
    R('A2', 'Rueda tensora derecha', 2, now('FL-11', S)),
    R('A2', 'Buje pin central derecho', 3, now('SL-V', S)),
    R('A2', 'Rodado izquierdo', 18, now('SL-V', ROJ)),
    R('A2', 'Rueda tensora izquierda', 2, now('FL-11', S)),
    R('A2', 'Buje pin central izquierdo', 3, now('SL-V', S)),

    R('B1', 'Tx-Hoist', 12, now('SL-V', V)),

    R('B2', 'Tx-Crowd', 4, now('SL-V', V)),
    R('B2', 'Corona de giro derecho', 6, now('SL-V', V)),
    R('B2', 'Pista roller giro derecho', 2, now('SL-V', S)),
    R('B2', 'Corona de giro izquierdo', 6, now('SL-V', V)),
    R('B2', 'Pista roller giro izquierdo', 2, now('SL-V', S)),
    R('B2', 'Golilla de pin central', 2, now('SL-V', S)),
    R('B2', 'Saddle block', 18, now('SL-V', V)),

    R('C1', 'Tx-Crowd lado derecho', 3, now('SL-V', S)),
    R('C1', 'Tx-Crowd lado izquierdo', 2, now('SL-V', S)),
    R('C1', 'Tx-giro derecho', 2, now('SL-V', S)),
    R('C1', 'Tx-giro izquierdo', 2, now('SL-V', S)),
    R('C1', 'Dipper Trip', 3, now('SL-V', S)),
    R('C1', 'Tx-Hoist', 2, now('SL-V', S)),
    R('C1', 'Pluma', 2, now('SL-V', S)),
    R('C1', 'Punto FL-32 (sin nombre en matriz)', 4, now('FL-32', 'Estándar')),
    R('C1', 'A-Frame', 4, now('FL-32', 'Estándar')),
    R('C1', 'Rodillos guía cable', 8, now('FL-32', 'Estándar')),

    R('C2', 'Ruedas motrices derecha', 4, now('SL-V', S)),
    R('C2', 'Ruedas motrices izquierda', 4, now('SL-V', S)),
  ];
}

function makeState() {
  return {
    hoursDay: 14.41, propel: 10, period: 'all', sel: 'A2', selMonth: null,
    dens: { ultra: LUBES.ultra.dens, term: LUBES.term.dens },
    lube: { A1: 'ultra', A2: 'ultra', B1: 'ultra', B2: 'ultra', C1: 'term', C2: 'term' },
    t: { ...T_REF },
    inj: mkInj(), nextId: 1000,
    months: MONTHS.map((m) => ({ ...m })),
    open: { A2: true },
    flujoBase: 384.1,
    lab: { row: null, type: 'SL-V', adj: 'Camisa verde' },
  };
}

/* Ciclos por hora. A2 mezcla excavar (estático) y trasladar según el % de propulsión. */
function cphOf(st, s) {
  const per = (min) => (min > 0 ? 60 / min : 0);
  if (s === 'A2') {
    const p = st.propel / 100;
    const dig = (1 - p) * per(st.t.A2dig), mov = p * per(st.t.A2prop);
    return { dig, mov, total: dig + mov };
  }
  const c = per(st.t[s]);
  return { dig: c, mov: 0, total: c };
}

/* Consumo por sistema y total, para la condición actual (now) y la anterior (old).
   cc/h = cc por ciclo × ciclos/h ;  g/h = cc/h × densidad del lubricante del sistema */
function compute(st) {
  const sys = {};
  const tot = { now: { g: 0, cc: 0, ultra: 0, term: 0 }, old: { g: 0, cc: 0, ultra: 0, term: 0 } };
  for (const s of ORDER) {
    const lube = st.lube[s], dens = n(st.dens[lube]), cph = cphOf(st, s);
    const o = { cph, lube, dens, qty: 0 };
    for (const r of st.inj) if (r.system === s) o.qty += n(r.qty);
    for (const k of ['now', 'old']) {
      let cc = 0;
      for (const r of st.inj) if (r.system === s) cc += n(r.qty) * n(r[k].cc);
      const ccH = cc * cph.total, gH = ccH * dens;
      o[k] = { cc, ccH, gH };
      tot[k].g += gH; tot[k].cc += ccH; tot[k][lube] += gH;
    }
    if (s === 'A2') {
      const stat = st.t.A2dig > 0 ? 60 / st.t.A2dig : 0;
      o.staticOnly = o.now.cc * stat * dens;
      o.propelExtra = o.now.gH - o.staticOnly;
    }
    sys[s] = o;
  }
  return { sys, tot };
}

function periodMonths(st) {
  return st.months.map((m, i) => ({ ...m, i })).filter((m) => st.period === 'all' || String(m.y) === st.period);
}
function periodHours(st) { return periodMonths(st).reduce((t, m) => t + n(m.h), 0); }

if (typeof module !== 'undefined') module.exports = { ORDER, SYS, LUBES, INJ, T_REF, makeState, compute, cphOf, periodHours };
</script>

          <div class="lane fl1"><span class="k" style="color:var(--steel-2)">FL-1</span><div class="track"><div class="fill" id="v-bo"></div><span class="val num" id="v-vo"></span></div></div>
        </div>
        <div style="display:grid;gap:8px;align-content:center">
          <div class="bigsave"><b class="num" id="v-save">0</b><span>kg menos con SL-V en este turno</span></div>
          <div class="prog"><i id="v-prog"></i></div>
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)"><span id="v-time"></span><span id="v-cyc"></span></div>
        </div>
      </div>
    </section>

    <section id="parametros" class="pgrid">
      <div class="panel pad fieldset"><h2>Densidad por lubricante</h2>
        <label>Molylube Ultra Open Gear · A1, A2, B1, B2<input class="field num" type="number" step="0.001" min="0.5" max="1.5" id="d-ultra"><small>g/cc</small></label>
        <label>Termalene Multipurpose Extreme Pressure Grease · C1, C2<input class="field num" type="number" step="0.001" min="0.5" max="1.5" id="d-term"><small>g/cc</small></label>
      </div>
      <div class="panel pad fieldset"><h2>Lubricante de cada sistema</h2><div class="lubesys">${lubeSel}</div><p class="note" style="margin:0"><b>Ultra</b> = ${LUBES.ultra.name}<br><b>Termalene</b> = ${LUBES.term.name}</p></div>
      <div class="panel pad fieldset"><h2>Referencias</h2>
        <label>Horas por día (turno en vivo)<input class="field num" type="number" step="0.01" min="1" max="24" id="p-hd"></label>
        <label>Base del flujo Ultra granel<input class="field num" type="number" step="0.1" min="0" id="p-flujo"><small>g/h por pala, columna Gr/hora del archivo</small></label>
      </div>
    </section>

    <details class="panel notes"><summary>Cómo se calcula y notas sobre los datos</summary><div class="body">
      <p><b>Cálculo.</b> ciclos/h = 60 ÷ frecuencia. cc/h = cc por ciclo × ciclos/h. g/h = cc/h × densidad del lubricante del sistema. En A2, ciclos/h = (1 − %prop) × 60 ÷ timer de excavar + %prop × 60 ÷ timer de trasladar.</p>
      <p><b>Catalinas silla.</b> En la matriz Excel están dentro de A1 (así cuadra el total de 30,24 cc/h). En el informe y el brief inicial aparecían en A2. Puedes moverlas con el selector de sistema de cada fila.</p>
      <p><b>C2 a 2 min.</b> La matriz usa 2 minutos; el informe PAB12 muestra 3. Se tomó la matriz como referencia; el botón restablecer vuelve a ese valor.</p>
      <p><b>Hoja FL-1, sistema B2.</b> La celda de B2 en la hoja FL-1 mantiene 302,16 cc/h, que es el valor de SL-V. Con 40 inyectores a 1,61 cc cada 10 min corresponde 386,4 cc/h; la app usa el valor calculado.</p>
      <p><b>Horas.</b> Hoja 2025 del flujo Ultra granel, solo PAB12: enero–diciembre 2025 y luego enero–julio y septiembre 2026. Agosto 2026 no aparece en el archivo; ingresa las horas en el panel de la comparación si las tienes. Mayo 2025 figura con 0 horas.</p>
    </div></details>
  </main>`;
}

/* ───────── actualización ───────── */
function setTag(el, now, old) {
  if (!(old > 0 && now > 0)) { el.textContent = '—'; el.className = 'tag neutral'; return; }
  const p = (old - now) / now;            /* variación del consumo si se usara FL-1 en vez de SL-V */
  el.textContent = `${sgn(p)} con FL-1`;
  el.className = 'tag ' + (p > 0 ? 'bad' : 'ok');
}
const periodLabel = () => (state.period === 'all' ? '2025 y 2026' : state.period);

function refresh() {
  C = compute(state);
  updateHero(); updateCards(); updateMonthly(); updateInvSums(); renderLabDelta(); paintShovel(); renderLive();
}

function updateHero() {
  const P = periodHours(state), t = C.tot;
  $('k-now').textContent = fmt(t.now.g, 0);
  $('k-old').textContent = fmt(t.old.g, 0);
  setTag($('k-tag'), t.now.g, t.old.g);
  $('k-basis').textContent = `Tasa por hora de operación: no depende de las horas. Ciclos por hora (60 ÷ timer) × cc por ciclo × densidad; el A2 mezcla ${100 - state.propel} % excavando y ${state.propel} % trasladando. Las horas solo la convierten en kg.`;
  $('k-sub').textContent = `${fmt((t.now.g * state.hoursDay) / 1000, 1)} kg por día de ${fmt(state.hoursDay, 2)} h · ${fmt((t.now.g * P) / 1000, 0)} kg en ${periodLabel()}`;
  $('p-val').innerHTML = `${state.propel}<small> %</small>`;
  const sl = $('propel'); sl.value = state.propel; sl.style.setProperty('--v', state.propel + '%');
  updateDetail();
}

function updateDetail() {
  const s = state.sel, o = C.sys[s];
  $('detail').style.setProperty('--c', SYS[s].hue);
  $('d-code').textContent = s; $('d-name').textContent = SYS[s].name;
  $('d-g').textContent = fmt(o.now.gH, 1);
  setTag($('d-tag'), o.now.gH, o.old.gH);
  $('d-lube').textContent = `${LUBES[o.lube].name} · ${fmt(o.dens, 3)} g/cc`;
  $('d-qty').textContent = o.qty; $('d-cc').textContent = fmt(o.now.cc, 2); $('d-cph').textContent = fmt(o.cph.total, 1);
  const note = $('d-note');
  note.hidden = s !== 'A2';
  if (s === 'A2') note.textContent = `Excavando ${fmt(o.cph.dig, 1)} ciclos/h y trasladando ${fmt(o.cph.mov, 1)} ciclos/h. Moverse suma ${fmt(o.propelExtra, 0)} g/h frente a operar 100 % estático.`;
}

function updateCards() {
  const P = periodHours(state);
  let max = 0;
  ORDER.forEach((s) => { max = Math.max(max, C.sys[s].now.gH, C.sys[s].old.gH); });
  ORDER.forEach((s) => {
    const o = C.sys[s];
    $(`sc-${s}-lube`).textContent = `${LUBES[o.lube].name} · ${fmt(o.dens, 3)} g/cc`;
    $(`sc-${s}-bn`).style.width = (max > 0 ? (o.now.gH / max) * 100 : 0) + '%';
    $(`sc-${s}-bo`).style.width = (max > 0 ? (o.old.gH / max) * 100 : 0) + '%';
    $(`sc-${s}-vn`).textContent = fmt(o.now.gH, 1) + ' g/h';
    $(`sc-${s}-vo`).textContent = fmt(o.old.gH, 1) + ' g/h';
    const sv = $(`sc-${s}-save`);
    if (o.now.gH > 0 && o.old.gH > 0) { const p = (o.old.gH - o.now.gH) / o.now.gH; sv.textContent = sgn(p); sv.className = 'num ' + (p > 0 ? 'bad' : 'ok'); } else { sv.textContent = '—'; sv.className = 'num'; }
    $(`sc-${s}-cph`).textContent = fmt(o.cph.total, 1);
    $(`sc-${s}-cc`).textContent = fmt(o.now.cc, 2);
    $(`sc-${s}-kg`).textContent = fmt((o.now.gH * P) / 1000, 0);
    /* chips de inyectores por tipo y ajuste (condición actual) */
    const groups = {};
    state.inj.filter((r) => r.system === s).forEach((r) => {
      const k = r.now.type + '|' + r.now.adj;
      (groups[k] = groups[k] || { q: 0, sel: r.now }).q += n(r.qty);
    });
    $(`sc-${s}-chips`).innerHTML = Object.values(groups).map((g) =>
      `<span class="chip" style="--dot:${colorOf(g.sel)}"><i></i><b>${g.q}</b> ${g.sel.type} · ${esc(g.sel.adj)} · ${num2(g.sel.cc)} cc</span>`).join('') || '<span class="pill">Sin inyectores cargados</span>';
  });
  Object.keys(T_REF).forEach((k) => {
    const el = document.querySelector(`[data-tin="${k}"]`);
    if (document.activeElement !== el) el.value = state.t[k];
    document.querySelector(`[data-treset="${k}"]`).hidden = state.t[k] === T_REF[k];
  });
  const a2 = C.sys.A2;
  $('sc-A2-note').textContent = `Con ${state.propel} % de traslado, A2 hace ${fmt(a2.cph.total, 1)} ciclos/h. Trasladar agrega ${fmt(a2.propelExtra, 0)} g/h frente a 100 % excavando.`;
}


/* ───────── gráfico de líneas por lubricante ───────── */
function niceMax(v) { if (!(v > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

function lineSvg(key, W) {
  const pm = periodMonths(state), H = 236, L = 50, R = 12, T = 12, B = 40, pw = W - L - R, ph = H - T - B;
  const val = (m, k) => (m.missing ? null : (C.tot[k][key] * n(m.h)) / 1000);
  let mx = 0; pm.forEach((m) => ['now', 'old'].forEach((k) => { const v = val(m, k); if (v !== null) mx = Math.max(mx, v); }));
  const top = niceMax(mx * 1.04), x = (j) => L + (pm.length > 1 ? (pw * j) / (pm.length - 1) : pw / 2), y = (v) => T + ph * (1 - v / top);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = (top * i) / 4, yy = y(v).toFixed(1); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="lc-g"/><text x="${L - 7}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end" class="lc-t">${fmt(v, top < 10 ? 1 : 0)}</text>`; }
  let xl = '', hit = '', guide = '';
  const stepW = pm.length > 1 ? pw / (pm.length - 1) : pw;
  pm.forEach((m, j) => {
    const first = j === 0 || m.m === 0;
    xl += `<text x="${x(j).toFixed(1)}" y="${H - B + 15}" text-anchor="middle" class="lc-t">${MES[m.m]}</text>` + (first || m.missing ? `<text x="${x(j).toFixed(1)}" y="${H - B + 28}" text-anchor="middle" class="lc-t lc-y">${m.missing ? 'sin dato' : m.y}</text>` : '');
    const k1 = val(m, 'now'), k2 = val(m, 'old');
    hit += `<rect class="lc-hit" data-m="${m.i}" x="${(x(j) - stepW / 2).toFixed(1)}" y="${T}" width="${stepW.toFixed(1)}" height="${ph}" fill="transparent"><title>${MES[m.m]} ${m.y} · ${fmt(m.h, 1)} h${k1 === null ? ' · sin dato' : ` · SL-V ${fmt(k1, 0)} kg · FL-1 ${fmt(k2, 0)} kg`}</title></rect>`;
    if (state.selMonth === m.i) guide = `<line x1="${x(j).toFixed(1)}" x2="${x(j).toFixed(1)}" y1="${T}" y2="${T + ph}" class="lc-sel"/>`;
  });
  const path = (k) => { let d = '', pen = false; pm.forEach((m, j) => { const v = val(m, k); if (v === null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(j).toFixed(1)} ${y(v).toFixed(1)} `; pen = true; }); return d; };
  const dots = (k, r, col) => pm.map((m, j) => { const v = val(m, k); return v === null ? '' : `<circle cx="${x(j).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${r}" fill="${col}" stroke="var(--bg-2)" stroke-width="1.5"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Consumo mensual en kg, SL-V actual y FL-1 anterior">${g}${guide}
    <path d="${path('old')}" fill="none" stroke="var(--steel)" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path('now')}" fill="none" stroke="var(--amber)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots('old', 3, 'var(--steel)')}${dots('now', 3.6, 'var(--amber)')}${xl}${hit}</svg>`;
}

function updateLines() {
  const box = $('lines'); if (!box) return;
  const pm = periodMonths(state), P = pm.reduce((t, m) => t + n(m.h), 0), t = C.tot;
  const cw = Math.max(box.clientWidth || 0, 0), cols = cw >= 900 ? 2 : 1;
  const panelW = Math.max(((cw || 1100) - (cols - 1) * 14) / cols - 30, 280), W = Math.max(panelW, cols === 2 ? pm.length * 19 + 56 : pm.length * 24 + 62);
  const sm = state.selMonth, selM = sm !== null ? pm.find((m) => m.i === sm) : null;
  box.innerHTML = ['ultra', 'term'].map((key) => {
    const sys = ORDER.filter((s) => state.lube[s] === key), kn = (t.now[key] * P) / 1000, ko = (t.old[key] * P) / 1000;
    let rd = 'Toca un punto del gráfico o una barra para ver el detalle del mes.';
    if (selM) { const a = (t.now[key] * n(selM.h)) / 1000, b = (t.old[key] * n(selM.h)) / 1000; rd = selM.missing ? `${MES[selM.m]} ${selM.y} · sin dato de horas` : `${MES[selM.m]} ${selM.y} · ${fmt(selM.h, 1)} h · SL-V ${fmt(a, 0)} kg · FL-1 ${fmt(b, 0)} kg · con FL-1 ${b - a < 0 ? '−' : '+'}${fmt(Math.abs(b - a), 0)} kg`; }
    return `<div class="lpanel"><div class="lhead"><div><h3>${LUBES[key].name}</h3>
      <p>${sys.length ? 'Sistemas ' + sys.join(', ') : 'Sin sistemas asignados'} · ${fmt(n(state.dens[key]), 3)} g/cc</p></div>
      <div class="ltot"><b class="${ko > kn ? 'bad' : ''}">${kn > 0 ? sgn((ko - kn) / kn) + ' con FL-1' : '—'}</b><span>${fmt(kn, 0)} kg SL-V · ${fmt(ko, 0)} kg FL-1 en el periodo</span></div></div>
      <div class="lscroll">${lineSvg(key, W)}</div><p class="note lread">${rd}</p></div>`;
  }).join('');
}

function monthKg(m) { return { now: (C.tot.now.g * n(m.h)) / 1000, old: (C.tot.old.g * n(m.h)) / 1000 }; }

function updateMonthly() {
  const pm = periodMonths(state), vis = new Set(pm.map((m) => m.i));
  let max = 0;
  state.months.forEach((m, i) => { if (vis.has(i)) { const k = monthKg(m); max = Math.max(max, k.now, k.old); } });
  state.months.forEach((m, i) => {
    const col = $('mc-' + i); col.hidden = !vis.has(i);
    const k = monthKg(m);
    $('bs-' + i).style.height = (max > 0 ? (k.now / max) * PLOT : 0) + 'px';
    $('bf-' + i).style.height = (max > 0 ? (k.old / max) * PLOT : 0) + 'px';
    $('bs-' + i).classList.toggle('zero', n(m.h) <= 0); $('bf-' + i).classList.toggle('zero', n(m.h) <= 0);
    col.title = `${MES[m.m]} ${m.y}: ${fmt(m.h, 1)} h · SL-V ${fmt(k.now, 0)} kg · FL-1 ${fmt(k.old, 0)} kg`;
    col.setAttribute('aria-pressed', String(state.selMonth === i));
  });
  const P = pm.reduce((t, m) => t + n(m.h), 0), t = C.tot;
  const kn = (t.now.g * P) / 1000, ko = (t.old.g * P) / 1000;
  $('t-h').innerHTML = `${fmt(P, 0)}<small>h</small>`;
  $('t-now').innerHTML = `${fmt(kn, 0)}<small>kg</small>`;
  $('t-old').innerHTML = `${fmt(ko, 0)}<small>kg</small>`;
  $('t-diff').innerHTML = `${ko - kn < 0 ? '−' : '+'}${fmt(Math.abs(ko - kn), 0)}<small>kg</small>`;
  setTag($('t-tag'), kn, ko);
  const row = (name, a, b) => `<div class="sr"><span>${name}</span><b class="a num">${fmt(a, 0)}</b><b class="s num">${fmt(b, 0)}</b></div>`;
  $('t-split').innerHTML = `<div class="sr h"><span>kg en el periodo</span><span>SL-V</span><span>FL-1</span></div>` +
    row(LUBES.ultra.name, (t.now.ultra * P) / 1000, (t.old.ultra * P) / 1000) + row(LUBES.term.name, (t.now.term * P) / 1000, (t.old.term * P) / 1000);
  const base = n(state.flujoBase), ultraSinA2 = t.now.ultra - C.sys.A2.now.gH;
  $('t-flujo').textContent = base > 0
    ? `Referencia: el flujo Ultra granel usa ${fmt(base, 1)} g/h por pala (${fmt((base * P) / 1000, 0)} kg en el periodo). Esta matriz da ${fmt(t.now.ultra, 0)} g/h con Ultra (${sgn((t.now.ultra - base) / base)}) y ${fmt(ultraSinA2, 0)} g/h si se excluye A2.`
    : '';
  const sm = state.selMonth;
  if (sm !== null && vis.has(sm)) {
    const m = state.months[sm], k = monthKg(m);
    $('mread').textContent = `${MES[m.m]} ${m.y} · ${fmt(m.h, 1)} h · SL-V ${fmt(k.now, 0)} kg · FL-1 ${fmt(k.old, 0)} kg · con FL-1 ${k.old - k.now < 0 ? '−' : '+'}${fmt(Math.abs(k.old - k.now), 0)} kg`;
  } else $('mread').textContent = 'Toca una barra para ver el detalle del mes.';
  document.querySelectorAll('#period button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.p === state.period)));
  updateLines();
}

function paintShovel() {
  const s = state.sel;
  ORDER.forEach((k) => {
    const on = k === s, o = C.sys[k];
    const share = C.tot.now.g > 0 ? o.now.gH / C.tot.now.g : 0;
    $('hc-' + k).setAttribute('r', on ? 24 : 19);
    $('hc-' + k).setAttribute('stroke-width', on ? 6 : 4);
    $('hd-' + k).setAttribute('r', 5 + share * 14);
    $('ht-' + k).setAttribute('font-size', on ? 24 : 20);
    const interval = o.cph.total > 0 ? 60 / o.cph.total : 30;
    $('ring-' + k).style.setProperty('--dur', clamp(interval / 8, 0.5, 4) + 's');
  });
  const fx = $('trackfx');
  fx.style.setProperty('--tdur', clamp(3 - state.propel / 40, 0.6, 3) + 's');
  fx.setAttribute('opacity', state.propel > 0 ? 0.85 : 0);
}

function paintSel() {
  const s = state.sel;
  document.querySelectorAll('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pick === s)));
  document.querySelectorAll('[data-card]').forEach((c) => c.setAttribute('aria-selected', String(c.dataset.card === s)));

/* ───────── inventario ───────── */
function selHtml(r, k) {
  const cur = r[k], val = cur.adj === CUSTOM ? 'custom' : cur.type + '|' + cur.adj;
  const groups = Object.keys(INJ).map((t) => `<optgroup label="${t}">${INJ[t].map((a) =>
    `<option value="${t}|${a[0]}" ${val === t + '|' + a[0] ? 'selected' : ''}>${a[0]}</option>`).join('')}</optgroup>`).join('');
  return `<select class="field" data-i="${r.id}" data-f="${k}" aria-label="Tipo y ajuste">${groups}<option value="custom" ${val === 'custom' ? 'selected' : ''}>${CUSTOM}</option></select>`;
}

function rowHtml(r) {
  const sysSel = ORDER.map((s) => `<option ${s === r.system ? 'selected' : ''}>${s}</option>`).join('');
  return `<div class="irow" data-row="${r.id}">
    <label class="f-name"><span>Componente</span><input class="field" data-i="${r.id}" data-f="name" value="${esc(r.name)}"></label>
    <label class="f-qty"><span>Cant.</span><input class="field num" type="number" inputmode="numeric" min="0" step="1" data-i="${r.id}" data-f="qty" value="${r.qty}"></label>
    <label class="f-sys"><span>Sistema</span><select class="field" data-i="${r.id}" data-f="sys">${sysSel}</select></label>
    <label class="f-now"><span>Actual · tipo y ajuste</span>${selHtml(r, 'now')}</label>
    <label class="f-nowcc"><span>cc actual</span><input class="field num" type="number" min="0" step="0.01" data-i="${r.id}" data-f="nowcc" value="${r.now.cc}"></label>
    <label class="f-old"><span>Anterior · tipo y ajuste</span>${selHtml(r, 'old')}</label>
    <label class="f-oldcc"><span>cc anterior</span><input class="field num" type="number" min="0" step="0.01" data-i="${r.id}" data-f="oldcc" value="${r.old.cc}"></label>
    <div class="f-sum"><span>cc por ciclo (actual → anterior)</span><b class="num" id="rs-${r.id}"></b></div>
    <button class="x" data-del="${r.id}" aria-label="Quitar ${esc(r.name)}">${ic('x', 16)}</button></div>`;
}

function renderInventory() {
  $('inv').innerHTML = ORDER.map((s) => {
    const rows = state.inj.filter((r) => r.system === s);
    return `<details class="panel grp" data-grp="${s}" style="--c:${SYS[s].hue}" ${state.open[s] ? 'open' : ''}>
      <summary><span class="code">${s}</span><span class="nm">${SYS[s].name}<small id="gl-${s}"></small></span><span class="sum"><b id="gq-${s}"></b><span id="gc-${s}"></span></span><i class="chev"></i></summary>
      ${rows.length ? `<div class="rows">${rows.map(rowHtml).join('')}</div>` : '<p class="empty">Este sistema no tiene puntos cargados. Agrega el primero o mueve uno desde otro sistema.</p>'}
      <button class="add" data-add="${s}">${ic('plus', 16)}<span>Agregar punto a ${s}</span></button></details>`;
  }).join('');
  updateInvSums();
}

function updateInvSums() {
  if (!C) return;
  state.inj.forEach((r) => {
    const el = $('rs-' + r.id); if (!el) return;
    el.textContent = `${fmt(n(r.qty) * n(r.now.cc), 2)} → ${fmt(n(r.qty) * n(r.old.cc), 2)}`;
  });
  ORDER.forEach((s) => {
    const o = C.sys[s]; if (!$('gq-' + s)) return;
    $('gq-' + s).textContent = `${o.qty} inyectores`;
    $('gc-' + s).textContent = `${fmt(o.now.cc, 2)} cc/ciclo`;
    $('gl-' + s).textContent = `${LUBES[o.lube].name} · ${fmt(o.now.gH, 0)} g/h`;
  });
}

function invEdit(target, isChange) {
  const id = +target.dataset.i, f = target.dataset.f, r = state.inj.find((x) => x.id === id);
  if (!r) return;
  const v = target.value;
  if (f === 'name') { if (isChange) { r.name = v; renderLabOptions(); } return; }
  if (f === 'qty') { r.qty = Math.max(0, parseInt(v, 10) || 0); refresh(); return; }
  if (f === 'nowcc' || f === 'oldcc') {
    const k = f === 'nowcc' ? 'now' : 'old';
    r[k].cc = Math.max(0, parseFloat(v) || 0); r[k].adj = CUSTOM;
    const sel = document.querySelector(`select[data-i="${id}"][data-f="${k}"]`); if (sel) sel.value = 'custom';
    refresh(); return;
  }
  if ((f === 'now' || f === 'old') && isChange) {
    if (v === 'custom') r[f].adj = CUSTOM;
    else { const [t, a] = v.split('|'); r[f] = optOf(t, a); }
    const cc = document.querySelector(`input[data-i="${id}"][data-f="${f}cc"]`); if (cc) cc.value = r[f].cc;
    refresh(); return;
  }
  if (f === 'sys' && isChange) { r.system = v; state.open[v] = true; renderInventory(); renderLabOptions(); refresh(); }
}

/* ───────── laboratorio ───────── */
const labRow = () => state.inj.find((r) => r.id === state.lab.row) || state.inj[0];
const labSpec = () => INJ[state.lab.type].find((a) => a[0] === state.lab.adj) || INJ[state.lab.type][0];

function syncLabFromRow() {
  const r = labRow(); if (!r) return;
  state.lab.type = r.now.type;
  state.lab.adj = r.now.adj === CUSTOM ? INJ[r.now.type][INJ[r.now.type].length - 1][0] : r.now.adj;
}

function renderLabOptions() {
  const sel = $('lab-row');
  sel.innerHTML = ORDER.map((s) => `<optgroup label="${s} · ${SYS[s].name}">${state.inj.filter((r) => r.system === s).map((r) =>
    `<option value="${r.id}">${esc(r.name)} · ${r.qty} iny.</option>`).join('')}</optgroup>`).join('');
  if (!state.inj.find((r) => r.id === state.lab.row) && state.inj[0]) { state.lab.row = state.inj[0].id; syncLabFromRow(); }
  sel.value = state.lab.row;
  renderLab();
}

function renderLab() {
  $('lab-types').innerHTML = Object.keys(INJ).map((t) => `<button data-lt="${t}" aria-pressed="${t === state.lab.type}">${t}</button>`).join('');
  $('lab-adjs').innerHTML = INJ[state.lab.type].map((a) =>
    `<button data-la="${esc(a[0])}" style="--dot:${a[2]}" aria-pressed="${a[0] === state.lab.adj}"><i></i><span>${a[0]}</span><b class="num">${num2(a[1])} cc</b></button>`).join('');
  $('lab-vis').innerHTML = labSvg(labSpec(), state.lab.type);
  renderLabDelta();
}

function renderLabDelta() {
  const r = labRow(); if (!r || !C) return;
  const sp = labSpec();
  const mod = state.inj.map((x) => (x.id === r.id ? { ...x, now: { type: state.lab.type, adj: sp[0], cc: sp[1] } } : x));
  const P = compute({ ...state, inj: mod });
  const s = r.system;
  $('lab-delta').innerHTML = `
    <div><span class="k">Ahora</span><span>${r.now.type} · ${esc(r.now.adj)} · ${num2(r.now.cc)} cc</span></div>
    <div><span class="k">Sistema ${s}</span><span class="num">${fmt(C.sys[s].now.gH, 1)} → <b style="color:${SYS[s].hue}">${fmt(P.sys[s].now.gH, 1)} g/h</b></span></div>
    <div><span class="k">Pala completa</span><span class="num">${fmt(C.tot.now.g, 0)} → <b style="color:${P.tot.now.g > C.tot.now.g ? 'var(--bad)' : 'var(--ok)'}">${fmt(P.tot.now.g, 0)} g/h</b></span></div>
    <div><span class="k">Con FL-1 sería</span><span class="num">${sgn((P.tot.old.g - P.tot.now.g) / P.tot.now.g)} (${fmt(P.tot.old.g, 0)} g/h)</span></div>`;
}

function labSvg(spec, type) {
  const color = spec[2], cc = spec[1], vial = clamp(cc / 8.2, 0.06, 1);
  const tag = type === 'SL-V' ? 'CAMISA' : type === 'FL-32' ? 'FIJO' : 'HILOS';
  const ticks = [0.25, 0.5, 0.75].map((f) => `<line x1="226" x2="230" y1="${240 - 120 * f}" y2="${240 - 120 * f}" stroke="#94A3B8"/>`).join('');
  const threads = [0, 1, 2, 3, 4, 5].map((i) => `<rect x="72" y="${44 + i * 7}" width="36" height="2.5" fill="#7A5210" opacity=".5"/>`).join('');
  const spring = '<path d="M90 186 l8 6 l-16 6 l16 6 l-16 6 l16 6 l-16 6 l8 6" stroke="#CBD5E1" stroke-width="2" fill="none"/>';
  return `<svg viewBox="0 0 260 300" role="img" aria-label="Inyector ${type}, ${esc(spec[0])}, ${num2(cc)} cc por disparo">
    <defs><linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#B8862B"/><stop offset=".5" stop-color="#F0C05A"/><stop offset="1" stop-color="#9C6F1E"/></linearGradient>
    <linearGradient id="chrome" x1="0" x2="1"><stop offset="0" stop-color="#6B7A90"/><stop offset=".5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#6B7A90"/></linearGradient>
    <clipPath id="vialClip"><rect x="196" y="120" width="34" height="120" rx="6"/></clipPath></defs>
    <rect x="66" y="14" width="48" height="26" rx="5" fill="url(#brass)"/><rect x="72" y="40" width="36" height="46" fill="url(#brass)"/>${threads}
    <rect x="62" y="86" width="56" height="34" rx="3" fill="${color}" stroke="#0A1220" stroke-width="1.5"/>
    <text x="90" y="107" text-anchor="middle" font-size="11" font-weight="800" fill="#0A1220" style="font-family:var(--display)">${tag}</text>
    <rect x="58" y="120" width="64" height="120" rx="6" fill="url(#brass)"/><rect x="76" y="128" width="28" height="104" rx="4" fill="#0A1220"/>
    <g class="piston"><rect x="80" y="132" width="20" height="46" rx="3" fill="url(#chrome)"/><rect x="83" y="136" width="14" height="6" fill="#4A5568"/></g>${spring}
    <rect x="122" y="196" width="34" height="16" rx="3" fill="url(#brass)"/><rect x="156" y="192" width="14" height="24" rx="3" fill="url(#chrome)"/>
    <g class="droplet"><circle cx="176" cy="204" r="${5 + vial * 8}" fill="#F5B324"/></g>
    <rect x="66" y="240" width="48" height="30" rx="4" fill="url(#chrome)"/><rect x="80" y="270" width="20" height="18" fill="url(#brass)"/>
    <rect x="196" y="120" width="34" height="120" rx="6" fill="#0A1220" stroke="#2F4367" stroke-width="1.5"/>
    <g clip-path="url(#vialClip)"><rect x="196" y="${240 - 120 * vial}" width="34" height="${120 * vial}" fill="${color}" opacity=".92"/></g>${ticks}
    <text x="213" y="262" text-anchor="middle" font-size="20" font-weight="800" fill="#E9EFF8" style="font-family:var(--display)">${num2(cc.toFixed(cc < 0.5 ? 3 : 2))}</text>
    <text x="213" y="276" text-anchor="middle" font-size="10" fill="#8597B2">cc por disparo</text>
    <text x="90" y="294" text-anchor="middle" font-size="18" font-weight="800" fill="${color}" style="font-family:var(--display)">${type}</text></svg>`;
}

/* ───────── turno en vivo ───────── */
function renderLive() {
  if (!C) return;
  const e = sim.elapsed, H = state.hoursDay, f = H > 0 ? e / H : 0;
  const kn = (C.tot.now.g * e) / 1000, ko = (C.tot.old.g * e) / 1000;
  const kmax = (Math.max(C.tot.now.g, C.tot.old.g) * H) / 1000 || 1;
  $('v-bn').style.width = (kn / kmax) * 100 + '%'; $('v-bo').style.width = (ko / kmax) * 100 + '%';
  $('v-vn').textContent = fmt(kn, 2) + ' kg'; $('v-vo').textContent = fmt(ko, 2) + ' kg';
  $('v-save').textContent = fmt(ko - kn, 2);
  $('v-prog').style.width = f * 100 + '%';
  $('v-time').textContent = `${fmt(e, 2)} h de ${fmt(H, 2)} h`;
  $('v-cyc').textContent = `${state.sel}: ${Math.floor(C.sys[state.sel].cph.total * e)} ciclos de lubricación`;
  $('v-sub').textContent = `Un día de operación (${fmt(H, 2)} h) corre en 30 segundos a 1×. Acumula los kilos de grasa de la pala completa.`;
  const lbl = sim.running ? 'pause' : e > 0 && e < H ? 'cont' : 'start';
  if (renderLive.lbl !== lbl) {
    renderLive.lbl = lbl;
    $('v-play').innerHTML = lbl === 'pause' ? `${ic('pause', 16)}<span>Pausar</span>` : `${ic('play', 16)}<span>${lbl === 'cont' ? 'Continuar' : 'Iniciar turno'}</span>`;
  }
  $('flows').hidden = !sim.running;
}

function tick(t) {
  if (!sim.running) return;
  if (!sim.last) sim.last = t;
  const dt = (t - sim.last) / 1000; sim.last = t;
  sim.elapsed += dt * (state.hoursDay / 30) * sim.speed;
  if (sim.elapsed >= state.hoursDay) { sim.elapsed = state.hoursDay; sim.running = false; }
  renderLive();
  if (sim.running) requestAnimationFrame(tick);
}
function simPlay() { if (sim.running) { sim.running = false; } else { if (sim.elapsed >= state.hoursDay) sim.elapsed = 0; sim.running = true; sim.last = 0; requestAnimationFrame(tick); } renderLive(); }
function simReset() { sim.running = false; sim.elapsed = 0; renderLive(); }

/* ───────── eventos ───────── */
function bind() {
  app.addEventListener('click', (e) => {
    const t = e.target; let el;
    if ((el = t.closest('[data-hot]'))) return select(el.dataset.hot);
    if ((el = t.closest('[data-pick]'))) return select(el.dataset.pick);
    if ((el = t.closest('[data-t]'))) {
      const k = el.dataset.t; state.t[k] = Math.max(1, n(state.t[k]) + n(el.dataset.d)); return refresh();
    }
    if ((el = t.closest('[data-treset]'))) { state.t[el.dataset.treset] = T_REF[el.dataset.treset]; return refresh(); }
    if ((el = t.closest('[data-p]'))) { state.period = el.dataset.p; if (state.selMonth !== null && !periodMonths(state).some((m) => m.i === state.selMonth)) state.selMonth = null; return refresh(); }
    if ((el = t.closest('[data-m]'))) { const i = +el.dataset.m; state.selMonth = state.selMonth === i ? null : i; return updateMonthly(); }
    if ((el = t.closest('[data-add]'))) {
      const s = el.dataset.add; const r = { id: ++state.nextId, system: s, name: 'Nuevo punto', qty: 1, now: optOf('SL-V', 'Camisa verde'), old: optOf('FL-1', 'Sin ajuste · 100 %') };
      state.inj.push(r); state.open[s] = true; renderInventory(); renderLabOptions(); return refresh();
    }
    if ((el = t.closest('[data-del]'))) { state.inj = state.inj.filter((r) => r.id !== +el.dataset.del); renderInventory(); renderLabOptions(); return refresh(); }
    if ((el = t.closest('[data-lt]'))) { state.lab.type = el.dataset.lt; state.lab.adj = INJ[state.lab.type][INJ[state.lab.type].length > 3 ? 2 : 0][0]; return renderLab(); }
    if ((el = t.closest('[data-la]'))) { state.lab.adj = el.dataset.la; return renderLab(); }
    if ((el = t.closest('[data-sp]'))) { sim.speed = +el.dataset.sp; document.querySelectorAll('#v-speed button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); return; }
    if (t.closest('#lab-fire')) return renderLab();
    if (t.closest('#lab-apply')) {
      const r = labRow(); if (!r) return; const sp = labSpec();
      r.now = { type: state.lab.type, adj: sp[0], cc: sp[1] }; state.open[r.system] = true; renderInventory(); return refresh();
    }
    if (t.closest('#v-play')) return simPlay();
    if (t.closest('#v-reset')) return simReset();
    if (t.closest('#reset')) return resetAll();
    if ((el = t.closest('[data-card]'))) { if (!t.closest('input,button,select')) select(el.dataset.card); }
  });

  app.addEventListener('keydown', (e) => {
    const el = e.target.closest && e.target.closest('[data-hot]');
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(el.dataset.hot); }
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'propel') { state.propel = +t.value; return refresh(); }
    if (t.dataset.tin) { const v = parseFloat(t.value); if (v > 0) { state.t[t.dataset.tin] = v; refresh(); } return; }
    if (t.dataset.hin !== undefined) { state.months[+t.dataset.hin].h = Math.max(0, parseFloat(t.value) || 0); return refresh(); }
    if (t.dataset.i) return invEdit(t, false);
    if (t.id === 'd-ultra') { state.dens.ultra = n(t.value); return refresh(); }
    if (t.id === 'd-term') { state.dens.term = n(t.value); return refresh(); }
    if (t.id === 'p-hd') { state.hoursDay = clamp(n(t.value), 1, 24); return refresh(); }
    if (t.id === 'p-flujo') { state.flujoBase = n(t.value); return refresh(); }
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.i) return invEdit(t, true);
    if (t.dataset.ls) { state.lube[t.dataset.ls] = t.value; return refresh(); }
    if (t.id === 'lab-row') { state.lab.row = +t.value; syncLabFromRow(); return renderLab(); }
  });

  app.addEventListener('toggle', (e) => {
    const g = e.target && e.target.dataset && e.target.dataset.grp;
    if (g) state.open[g] = e.target.open;
  }, true);
}

function select(s) { state.sel = s; paintSel(); }

function fillParams() {
  $('d-ultra').value = state.dens.ultra; $('d-term').value = state.dens.term;
  $('p-hd').value = state.hoursDay; $('p-flujo').value = state.flujoBase;
  document.querySelectorAll('[data-ls]').forEach((s) => { s.value = state.lube[s.dataset.ls]; });
  document.querySelectorAll('[data-hin]').forEach((i) => { i.value = state.months[+i.dataset.hin].h; });
}

function resetAll() {
  sim.running = false; sim.elapsed = 0;
  state = makeState();
  state.lab.row = state.inj[0].id; syncLabFromRow();
  fillParams(); renderInventory(); renderLabOptions(); paintSel(); refresh();
}

function init() {
  app.innerHTML = skeleton();
  state.lab.row = state.inj[0].id; syncLabFromRow();
  bind(); fillParams(); renderInventory();
  C = compute(state);
  renderLabOptions(); paintSel(); refresh();
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(updateLines, 120); });
}
init();
</script>
</body>
</html>
